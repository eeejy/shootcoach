[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shootcoach"
version = "0.1.0"
description = "취향저격 — 표적지·자세 융합 AI 사격 교정 MVP"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-contrib-python-headless",
  "opencv-python",
  "pyyaml",
  "pandas",
  "requests",
  "pillow",
]

[project.optional-dependencies]
ml = ["ultralytics"]
app = ["streamlit", "streamlit-image-coordinates", "fastapi", "uvicorn", "python-multipart"]
dev = ["pytest", "httpx"]
e2e = ["playwright"]

[tool.setuptools.packages.find]
include = ["shootcoach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "app.capture_server:app"

[tool.uv.sources]
# Ultralytics requires the GUI OpenCV distribution by package name. Redirect
# that metadata-only dependency to a local shim so Linux servers install the
# headless build that provides the same `cv2` module without X11 libraries.
opencv-python = { path = "vendor/opencv-python" }
