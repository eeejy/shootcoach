# A4 크기 합성 표적 (테스트·데모용). 실제 기본값은 configs/kcg_circle.yaml.
name: a4_practice
paper_mm: [210, 297]            # 폭, 높이
center_mm: [105, 160]           # 표적 중심 (종이 좌상단 기준, x→오른쪽, y→아래)
ring_count: 10                  # 10점(중앙) ~ 1점(바깥)
ring10_radius_mm: 8.0           # 10점 링 반지름
ring_step_mm: 8.0               # 링 간격 → 1점 링 반지름 80mm
black_from_ring: 7              # 7~10점 영역을 검은색 조준 영역으로 인쇄
bullet_diameter_mm: 9.0         # 9mm 탄 기준 (채점 시 탄공 가장자리 판정)
px_per_mm: 4.0                  # 보정(정면화) 후 이미지 해상도
