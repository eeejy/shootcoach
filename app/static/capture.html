<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BullsAI 표적지 촬영</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root { --accent:#1d4ed8; --accent-hover:#1e40af; --ok:#15803d; --warn:#b45309; --bad:#b91c1c;
          --fg:#18181b; --muted:#52525b; --bg:#fafafa; --card:#fff; --line:rgba(24,24,27,0.08); }
  @media (prefers-color-scheme: dark) { :root { --fg:#f4f4f5; --muted:#a1a1aa; --bg:#111113; --card:#1c1c1f; --line:rgba(255,255,255,0.1); } }
  * { box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  [hidden] { display:none !important; }
  body { margin:0; font-family:"Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px; font-weight:600; font-size:18px; letter-spacing:-0.02em; }
  header b { color:var(--accent); font-weight:600; }
  #stage { position:relative; width:100%; max-width:720px; margin:0 auto; background:#000; }
  video, #overlay { width:100%; display:block; }
  #overlay { position:absolute; inset:0; height:100%; }
  #status { margin:10px 16px; padding:12px 14px; border-radius:10px; font-size:16px; font-weight:500; background:var(--card); border:1px solid var(--line); }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .row { display:flex; gap:10px; margin:10px 16px; }
  button, .filebtn { flex:1; min-height:52px; font-size:17px; font-weight:500; border:0; border-radius:10px; background:var(--accent); color:#fff; transition:background 160ms ease; }
  button:not(:disabled):active { background:var(--accent-hover); }
  button:disabled { background:#9aa5b1; }
  .filebtn { display:flex; align-items:center; justify-content:center; }
  input[type=file] { display:none; }
  select { flex:1; min-height:44px; font-size:16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); padding:0 10px; }
  #result { margin:10px 16px 40px; }
  #result img { width:100%; border-radius:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-top:10px; line-height:1.55; }
  .card b { font-weight:600; }
  .muted { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<header>Bulls<b>AI</b> 표적지 촬영</header>
<div id="stage" hidden><video id="video" playsinline muted autoplay></video><canvas id="overlay"></canvas></div>
<div id="status">준비 중…</div>
<div class="row">
  <select id="hand"><option value="right">오른손잡이</option><option value="left">왼손잡이</option></select>
  <select id="dist"><option>5</option><option>10</option><option selected>15</option><option>25</option></select>
</div>
<div class="row" id="liveRow" hidden><button id="shutter" disabled>마커 4개가 보이면 촬영</button></div>
<div class="row" id="photoRow" hidden><label class="filebtn">표적지 촬영<input id="file" type="file" accept="image/*" capture="environment"></label></div>
<div id="result"></div>
<p class="muted" style="margin:0 16px 24px">사진은 이 PC로만 전송되어 분석됩니다. 외부 서버로 가지 않습니다.</p>
<script>
const $ = (id) => document.getElementById(id);
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const statusEl = $("status"), video = $("video"), ov = $("overlay"), shutter = $("shutter");
let okStreak = 0, busy = false;

function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ""; }

function describe(m) {
  if (m.ok) return ["마커 4개 확인 — 촬영하세요", "ok"];
  if (!m.found.length) return ["표적지 네 모서리의 마커가 보이게 비춰 주세요", "bad"];
  return [`마커 ${m.found.length}/4 — ${m.missing_ko.join(", ")} 마커가 안 보입니다`, "warn"];
}

function drawQuads(m) {
  const w = ov.width = ov.clientWidth * devicePixelRatio, h = ov.height = ov.clientHeight * devicePixelRatio;
  const g = ov.getContext("2d"); g.clearRect(0, 0, w, h);
  g.lineWidth = 5 * devicePixelRatio; g.strokeStyle = m.ok ? "#15803d" : "#b45309";
  for (const q of Object.values(m.quads)) {
    g.beginPath(); q.forEach(([x, y], i) => i ? g.lineTo(x * w, y * h) : g.moveTo(x * w, y * h)); g.closePath(); g.stroke();
  }
}

function frameBlob(maxSide) {
  const c = document.createElement("canvas"), s = Math.min(1, maxSide / Math.max(video.videoWidth, video.videoHeight));
  c.width = Math.round(video.videoWidth * s); c.height = Math.round(video.videoHeight * s);
  const g = c.getContext("2d"); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
  g.drawImage(video, 0, 0, c.width, c.height);
  return new Promise((r) => c.toBlob(r, "image/jpeg", maxSide > 1200 ? 0.92 : 0.8));
}

async function post(url, field, blob, extra) {
  const fd = new FormData(); fd.append(field, blob, "img.jpg");
  for (const [k, v] of Object.entries(extra || {})) fd.append(k, v);
  const r = await fetch(url, { method: "POST", body: fd, headers: { "X-Token": TOKEN } });
  const j = await r.json(); if (!r.ok) throw Object.assign(new Error(j.error || r.status), { data: j }); return j;
}

async function tick() {
  if (!busy && video.videoWidth) {
    busy = true;
    try {
      const m = await post("/api/markers", "frame", await frameBlob(960));
      drawQuads(m); const [t, c] = describe(m); setStatus(t, c);
      okStreak = m.ok ? okStreak + 1 : 0; shutter.disabled = okStreak < 2;
    } catch (e) { setStatus("PC와 연결이 끊겼습니다: " + e.message, "bad"); }
    busy = false;
  }
  setTimeout(tick, 350);
}

function render(r) {
  const s = r.stage1, g = r.group;
  const cands = s.candidates.map((c, i) => `<div class="card"><b>후보 ${i + 1}. ${c.cause_ko}</b><br>${c.guidance_ko}<br><span class="muted">훈련: ${c.drill_ko}</span></div>`).join("");
  $("result").innerHTML = `<img src="data:image/jpeg;base64,${r.overlay_jpg}">
    <div class="card"><b>${g.n}발 · ${g.total_score}점</b> · ${s.shape_ko} · ${s.sector_ko}<br><span class="muted">처리 ${Math.round(r.timings.total_s * 1000)}ms</span></div>
    ${s.zero_adjust ? `<div class="card">${s.zero_adjust.text_ko}</div>` : ""}
    ${s.notes.map((n) => `<div class="card muted">${n}</div>`).join("")}${cands}`;
  $("result").scrollIntoView({ behavior: "smooth" });
}

async function analyze(blob) {
  setStatus("분석 중…", "");
  try { render(await post("/api/analyze", "photo", blob, { handedness: $("hand").value, distance_m: $("dist").value })); setStatus("분석 완료", "ok"); }
  catch (e) { setStatus(e.message, "bad"); }
}

shutter.onclick = async () => analyze(await frameBlob(4000));
$("file").onchange = async (ev) => { const f = ev.target.files[0]; if (f) analyze(f); ev.target.value = ""; };

(async () => {
  if (window.isSecureContext && navigator.mediaDevices?.getUserMedia) {
    try {
      video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
      $("stage").hidden = false; $("liveRow").hidden = false; setStatus("표적지를 비춰 주세요", ""); tick(); return;
    } catch (e) { /* fall through to photo mode */ }
  }
  $("photoRow").hidden = false;
  setStatus(window.isSecureContext ? "카메라 권한이 없어 사진 모드로 전환했습니다" : "사진 모드 (실시간 가이드는 HTTPS에서만 동작)", "warn");
})();
</script>
</body>
</html>
