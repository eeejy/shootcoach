<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BullsAI 표적지 촬영</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Black+Ops+One&display=swap">
<style>
  :root { --bg:#0e1115; --card:#171b20; --card2:#1e242b; --line:#2a323b; --line2:#3a4550;
          --fg:#eef1f3; --muted:#8b959e; --steel:#c9d0d5; --red:#22566f; --red2:#5fc2ec;
          --ok:#4f9d6c; --warn:#c8963a; --bad:#e8544f; --kr:"Black Han Sans","Noto Sans KR",sans-serif; }
  * { box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  [hidden] { display:none !important; }
  body { margin:0; font-family:"Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color:var(--fg); background:var(--bg); min-height:100vh; }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); background:#0c0f13; }
  header img { width:52px; height:auto; border-radius:6px; }
  .brand { font:400 22px/1 "Black Ops One", monospace; color:var(--steel); letter-spacing:.03em; }
  .brand b { color:var(--red2); font-weight:inherit; }
  #stage { position:relative; width:calc(100% - 32px); max-width:720px; margin:14px auto 0; background:#000; border-radius:10px; overflow:hidden; border:1px solid var(--line2); }
  video, #overlay { width:100%; display:block; }
  #overlay { position:absolute; inset:0; height:100%; }
  #status { margin:12px 16px; padding:13px 14px; border-radius:8px; font:400 17px var(--kr); background:var(--card); border:1px solid var(--line); }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .row { display:flex; gap:10px; margin:10px 16px; }
  button, .filebtn { flex:1; min-height:54px; font:400 18px var(--kr); border:1px solid var(--red); border-radius:8px; color:#fff; background:var(--red); }
  button:not(:disabled):active, .filebtn:active { background:var(--red2); }
  button:disabled { background:var(--card2); border-color:var(--line2); color:var(--muted); }
  .filebtn { display:flex; align-items:center; justify-content:center; }
  input[type=file] { display:none; }
  select { flex:1; min-height:46px; font-size:16px; border-radius:8px; border:1px solid var(--line2); background:#12161b; color:var(--fg); padding:0 10px; }
  #result { margin:10px 16px 40px; }
  #result img { width:100%; border-radius:8px; border:1px solid var(--line); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-top:10px; line-height:1.6; }
  .card:first-of-type { border-left:3px solid var(--red); }
  .card b { font:400 17px var(--kr); }
  .muted { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<header><img src="/logo.png" alt="BullsAI" onerror="this.remove()"><span class="brand">BULLS<b>AI</b></span></header>
<div id="stage" hidden><video id="video" playsinline muted autoplay></video><canvas id="overlay"></canvas></div>
<div id="status">준비 중…</div>
<div class="row">
  <select id="hand"><option value="right">오른손잡이</option><option value="left">왼손잡이</option></select>
  <select id="dist"><option value="5">5m</option><option value="10" selected>10m</option><option value="15">15m</option><option value="25">25m</option></select>
  <select id="shots"><option value="5">5발</option><option value="10" selected>10발</option><option value="20">20발</option></select>
</div>
<div class="row" id="liveRow" hidden><button id="shutter" disabled>표적이 잡히면 촬영</button></div>
<div class="row" id="photoRow" hidden><label class="filebtn">표적지 촬영<input id="file" type="file" accept="image/*" capture="environment"></label></div>
<div id="result"></div>
<script>
const $ = (id) => document.getElementById(id);
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const statusEl = $("status"), video = $("video"), ov = $("overlay"), shutter = $("shutter");
let okStreak = 0, busy = false;

function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ""; }

function describe(m) { return [m.message, m.ok ? "ok" : (m.found ? "warn" : "bad")]; }

function drawTarget(m) {
  const w = ov.width = ov.clientWidth * devicePixelRatio, h = ov.height = ov.clientHeight * devicePixelRatio;
  const g = ov.getContext("2d"); g.clearRect(0, 0, w, h);
  if (!m.ellipse) return;
  const [cx, cy, a, b, ang] = m.ellipse;
  g.lineWidth = 5 * devicePixelRatio; g.strokeStyle = m.ok ? "#4f9d6c" : "#c8963a";
  g.beginPath(); g.ellipse(cx * w, cy * h, a * w, b * h, ang * Math.PI / 180, 0, 2 * Math.PI); g.stroke();
}

function frameBlob(maxSide) {
  const c = document.createElement("canvas"), s = Math.min(1, maxSide / Math.max(video.videoWidth, video.videoHeight));
  c.width = Math.round(video.videoWidth * s); c.height = Math.round(video.videoHeight * s);
  const g = c.getContext("2d"); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
  g.drawImage(video, 0, 0, c.width, c.height);
  return new Promise((r) => c.toBlob(r, "image/jpeg", maxSide > 1200 ? 0.92 : 0.8));
}

async function post(url, field, blob, extra) {
  const fd = new FormData(); fd.append(field, blob, "img.jpg");
  for (const [k, v] of Object.entries(extra || {})) fd.append(k, v);
  const r = await fetch(url, { method: "POST", body: fd, headers: { "X-Token": TOKEN } });
  const j = await r.json(); if (!r.ok) throw Object.assign(new Error(j.error || r.status), { data: j }); return j;
}

async function tick() {
  if (!busy && video.videoWidth) {
    busy = true;
    try {
      const m = await post("/api/frame", "frame", await frameBlob(960));
      drawTarget(m); const [t, c] = describe(m); setStatus(t, c);
      okStreak = m.ok ? okStreak + 1 : 0; shutter.disabled = okStreak < 2;
    } catch (e) { setStatus("PC와 연결이 끊겼습니다: " + e.message, "bad"); }
    busy = false;
  }
  setTimeout(tick, 350);
}

function render(r) {
  const s = r.stage1, g = r.group;
  const cands = s.candidates.map((c, i) => `<div class="card"><b>후보 ${i + 1}. ${c.cause_ko}</b><br>${c.guidance_ko}<br><span class="muted">훈련: ${c.drill_ko}</span></div>`).join("");
  $("result").innerHTML = `<img src="data:image/jpeg;base64,${r.overlay_jpg}">
    <div class="card"><b>${g.n}발 · ${g.total_score}점</b> · ${s.shape_ko} · ${s.sector_ko}<br><span class="muted">처리 ${Math.round(r.timings.total_s * 1000)}ms</span></div>
    ${s.zero_adjust ? `<div class="card">${s.zero_adjust.text_ko}</div>` : ""}
    ${[...(r.notes || []), ...s.notes].map((n) => `<div class="card muted">${n}</div>`).join("")}${cands}`;
  $("result").scrollIntoView({ behavior: "smooth" });
}

async function analyze(blob) {
  setStatus("분석 중…", "");
  try { render(await post("/api/analyze", "photo", blob, { handedness: $("hand").value, distance_m: $("dist").value, expected: $("shots").value })); setStatus("분석 완료", "ok"); }
  catch (e) { setStatus(e.message, "bad"); }
}

shutter.onclick = async () => analyze(await frameBlob(4000));
$("file").onchange = async (ev) => { const f = ev.target.files[0]; if (f) analyze(f); ev.target.value = ""; };

(async () => {
  if (window.isSecureContext && navigator.mediaDevices?.getUserMedia) {
    try {
      video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
      $("stage").hidden = false; $("liveRow").hidden = false; setStatus("표적지를 비춰 주세요", ""); tick(); return;
    } catch (e) { /* fall through to photo mode */ }
  }
  $("photoRow").hidden = false;
  setStatus(window.isSecureContext ? "카메라 권한이 없어 사진 모드로 전환했습니다" : "사진 모드 (실시간 가이드는 HTTPS에서만 동작)", "warn");
})();
</script>
</body>
</html>
